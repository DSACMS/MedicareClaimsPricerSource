name: Sync Pricer Source Repos

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync pricer source from CMS GHE
        env:
          CMS_GHE_PAT: ${{ secrets.CMS_GHE_PAT }}
        run: ./.github/scripts/sync-pricers.sh

      - name: Open PR with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync pricer source from medicare-payment-modernization"
          branch: sync/pricer-source
          title: "Sync pricer source repos"
          body: "Automated sync of pricer source code from github.cms.gov/medicare-payment-modernization."
